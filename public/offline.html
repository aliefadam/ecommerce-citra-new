<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a3268">
    <title>Offline - Ecommerce Citra</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #1e293b; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        main { width: min(100%, 440px); padding: 32px; border: 1px solid #e2e8f0; border-radius: 20px; background: #fff; box-shadow: 0 18px 50px rgb(15 23 42 / .08); text-align: center; }
        .mark { display: grid; width: 64px; height: 64px; margin: 0 auto 20px; place-items: center; border-radius: 18px; background: #0a3268; color: #fff; font-size: 22px; font-weight: 800; }
        h1 { margin: 0; color: #0a3268; font-size: 24px; }
        p { margin: 12px 0 24px; color: #64748b; line-height: 1.6; }
        button { min-height: 44px; border: 0; border-radius: 12px; background: #ea580c; padding: 0 22px; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
        button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">EC</div>
        <h1>Koneksi terputus</h1>
        <p>Periksa koneksi internet Anda, lalu coba muat kembali halaman.</p>
        <button type="button" onclick="window.location.reload()">Coba lagi</button>
    </main>
</body>
</html>
