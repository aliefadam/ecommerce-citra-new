<svg xmlns="http://www.w3.org/2000/svg" width="480" height="408" viewBox="0 0 480 408" role="img" aria-labelledby="title description">
  <title id="title">Gambar produk belum tersedia</title>
  <desc id="description">Placeholder produk industrial dengan ilustrasi baut dan mur.</desc>

  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="440" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eaf2fb"/>
    </linearGradient>
    <linearGradient id="bolt" x1="147" y1="176" x2="337" y2="176" gradientUnits="userSpaceOnUse">
      <stop stop-color="#174d91"/>
      <stop offset="1" stop-color="#0a3268"/>
    </linearGradient>
    <linearGradient id="nut" x1="188" y1="143" x2="292" y2="257" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dceafe"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#174d91" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0a3268" flood-opacity=".15"/>
    </filter>
  </defs>

  <rect width="480" height="408" fill="url(#background)"/>
  <rect width="480" height="408" fill="url(#grid)"/>
  <circle cx="240" cy="190" r="126" fill="#ffffff" fill-opacity=".62"/>
  <circle cx="240" cy="190" r="104" fill="none" stroke="#174d91" stroke-opacity=".09" stroke-width="2" stroke-dasharray="5 9"/>

  <g filter="url(#shadow)">
    <g transform="rotate(-24 240 190)">
      <path d="M143 171h174c11 0 20 9 20 20s-9 20-20 20H143z" fill="url(#bolt)"/>
      <path d="M143 163 111 181v20l32 18 17-10v-36z" fill="#ed6718"/>
      <path d="m111 181 32 18 17-10-32-18z" fill="#ff8a43"/>
      <g fill="none" stroke="#dceafe" stroke-linecap="round" stroke-width="3" opacity=".75">
        <path d="m288 173 15 36"/>
        <path d="m300 173 15 36"/>
        <path d="m312 173 15 34"/>
        <path d="m324 177 11 26"/>
      </g>
    </g>

    <path d="m240 127 61 35v70l-61 35-61-35v-70z" fill="url(#nut)" stroke="#0d3b78" stroke-linejoin="round" stroke-width="10"/>
    <circle cx="240" cy="197" r="29" fill="#eaf2fb" stroke="#174d91" stroke-width="9"/>
    <path d="M222 187c8-14 28-17 39-5" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="5" opacity=".9"/>
  </g>

  <rect x="207" y="286" width="66" height="4" rx="2" fill="#ed6718"/>
  <text x="240" y="322" fill="#0a3268" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="2.2" text-anchor="middle">FOTO PRODUK</text>
  <text x="240" y="347" fill="#607594" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">Belum tersedia</text>

  <path d="M0 400h480v8H0z" fill="#0a3268"/>
  <path d="M0 400h104v8H0z" fill="#ed6718"/>
</svg>
